appId: com.viby.app
productName: Ondavi
copyright: Ondavi

directories:
  output: dist
  buildResources: resources

# Account links come back as viby://auth/callback; the OS routes them here.
protocols:
  - name: Ondavi
    schemes:
      - viby

files:
  - out/**/*
  - package.json
  # Baked from the annotated tags by scripts/build-changelog.mjs.
  - resources/changelog.json

# yt-dlp runs on the vendored CPython, so a packaged Viby needs no system Python.
# Both are copied into userData on first run, which keeps yt-dlp writable and
# self-updatable (see PLAN §2.3). Fetch the runtime with `npm run runtime`.
extraResources:
  - from: resources/bin
    to: bin
    filter: ['**/*']
  - from: resources/python/${os}-${arch}
    to: python
    filter: ['**/*']
  - from: resources/yt-dlp-plugins
    to: yt-dlp-plugins
    filter: ['**/*']
  - from: resources/tray
    to: tray
    filter: ['**/*']
  - from: resources/thumbar
    to: thumbar
    filter: ['**/*']

asar: true

mac:
  icon: resources/icon.icns
  target:
    # DMG only: the zip artifacts macOS in-place updates need (electron-updater
    # on mac updates from zip, not dmg) return with Developer ID signing, which
    # those updates also require. See PLAN §2.1.
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.music
  # Ad-hoc sign the bundle ("-" means no certificate). `identity: null` skipped
  # signing entirely, which left the arm64 app carrying Electron's upstream
  # signature after packaging changed the bundle; Apple Silicon reports an
  # invalid signature as "damaged", a dialog with no Open Anyway button. An
  # ad-hoc seal is valid, so removing the download quarantine is enough.
  # Developer ID signing + notarization would remove the warning entirely;
  # that needs a paid Apple account (PLAN §2.1).
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: Ondavi ${version}
  # No version in the filename: the release tag is the version, and the name
  # should tell a user which Mac they have, not which build they downloaded.
  # (arm64 -> arm, x64 -> intel happens in the release workflow, since
  # artifactName templates cannot map arches.)
  artifactName: Viby-macos-${arch}.${ext}
  # No .dmg.blockmap and no latest-mac.yml: macOS in-place updates need signing
  # and a zip target, so until signing is available the release carries the two
  # installers only. Windows keeps its latest.yml — it updates unsigned.
  writeUpdateInfo: false

win:
  icon: resources/icon.ico
  # Keep the executable path used by existing shortcuts and login items.
  executableName: Viby
  target:
    - target: nsis
      arch: [x64]
  # Already-installed versions look for this exact name in signed updates.
  artifactName: Viby-windows-${arch}.${ext}

nsis:
  shortcutName: Ondavi
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

# Update feed + release target, published by .github/workflows/release.yml when
# a v* tag is pushed. releaseType: release publishes immediately — the default
# draft never comes out on its own.
# Windows: true in-app auto-update. macOS: notify + download (unsigned builds cannot
# self-update — Squirrel.Mac requires a code signature).
publish:
  provider: github
  owner: Rei-SU
  repo: Viby
  releaseType: release
