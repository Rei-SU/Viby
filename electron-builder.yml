appId: com.viby.app
productName: Viby
copyright: Viby

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

# yt-dlp runs on the vendored CPython, so a packaged Viby needs no system Python.
# Both are copied into userData on first run, which keeps yt-dlp writable and
# self-updatable (see PLAN §2.3). Fetch the runtime with `npm run runtime`.
extraResources:
  - from: resources/bin
    to: bin
    filter: ['**/*']
  - from: resources/python/${os}-${arch}
    to: python
    filter: ['**/*']
  - from: resources/yt-dlp-plugins
    to: yt-dlp-plugins
    filter: ['**/*']

asar: true

mac:
  icon: resources/icon.icns
  target:
    # DMG only: the zip artifacts macOS auto-update needs (electron-updater on
    # mac updates from zip, not dmg) will be added back when in-app updates
    # are wired — which also requires code signing, see PLAN §2.1.
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.music
  # Unsigned on purpose: signing needs a paid Apple Developer account.
  # See PLAN §2.1 — macOS auto-update requires signing, Windows does not.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # No .dmg.blockmap and no latest-mac.yml: macOS auto-update needs signing
  # and a zip target, so until that is wired the release carries the two
  # installers only. Windows keeps its latest.yml — it updates unsigned.
  writeUpdateInfo: false

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

# Update feed + release target, published by .github/workflows/release.yml when
# a v* tag is pushed. releaseType: release publishes immediately — the default
# draft never comes out on its own.
# Windows: true in-app auto-update. macOS: notify + download (unsigned builds cannot
# self-update — Squirrel.Mac requires a code signature).
publish:
  provider: github
  owner: Rei-SU
  repo: Viby
  releaseType: release
