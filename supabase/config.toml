# Local Supabase CLI configuration for Viby.
#
# This file is for `supabase start` / `supabase db push` against a local or
# linked project. Nothing here is applied automatically, and nothing here
# carries a secret: keys are read from the CLI's own environment.
#
# Deliberate choices:
#   - magic-link and sign-up confirmation are both on, and the deep link
#     `viby://auth/callback` is allowed as a redirect, because NativeFlow uses
#     PKCE and hands the callback to the main process;
#   - analytics is off (Viby has no telemetry);
#   - the delete-account function keeps JWT verification on.

project_id = "viby"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
# Catches local sign-up and magic-link mail; nothing leaves the machine.
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Used when a request carries no redirect_to. The desktop app always sends
# redirect_to, so this only matters for links opened outside the app.
site_url = "http://127.0.0.1:54321"
additional_redirect_urls = ["viby://auth/callback"]
# Short-lived access tokens; AuthManager refreshes them in the main process.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
# Sign-up lands in pending-verification until the address is confirmed.
enable_confirmations = true
# Changing an email address needs confirmation on both the old and new one.
double_confirm_changes = true

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.delete-account]
# The function also verifies the caller with auth.getUser(); this keeps the
# gateway gate on as well.
verify_jwt = true

[functions.auth-open]
verify_jwt = false

[functions.send-email]
verify_jwt = false

[functions.spotify-resolve]
verify_jwt = false

[analytics]
enabled = false
