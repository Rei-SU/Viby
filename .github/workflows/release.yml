name: Release

# Push a v* tag -> build macOS (Intel + Apple Silicon) and Windows and publish
# everything to a GitHub Release for that tag. To cut a release:
#   1. Bump version in package.json and commit (it must match the tag).
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# Race-free publish: prepare-release creates the release as a DRAFT first; the
# platform jobs then *find* it (never create) and upload into it; the release
# goes live only after both platforms finish and (optionally) the update
# manifest is signed. Uses the built-in GITHUB_TOKEN, plus VIBY_UPDATE_KEY when
# update signing is configured (see CONTRIBUTING.md). If a publish step fails
# with 403, switch Actions -> General -> Workflow permissions to
# "Read and write".
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare (verify tag, create draft release)
    runs-on: ubuntu-latest
    steps:
      # Full history so the release notes can link the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG doesn't match package.json version $VERSION. Bump the version, commit, then push a new tag."
            exit 1
          fi

      # The annotated tag carries the release notes: they ship with the exact
      # commit they describe, with no separate file to maintain. A tag without
      # a grouped section fails here, before the draft exists.
      - name: Build release notes from the annotated tag
        run: |
          git fetch --tags --force --quiet
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          if ! grep -q '^### ' release-notes.md; then
            echo "::error::Tag $GITHUB_REF_NAME has no release notes. Re-tag it with -a -F <notes>."
            exit 1
          fi
          PREVIOUS=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            printf '\n---\n\n**Full changelog:** https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREVIOUS" "$GITHUB_REF_NAME" >> release-notes.md
          fi
          cat release-notes.md

      # Letting each platform job create the release itself would race (the
      # only unsynchronised call in electron-builder's GitHub publisher), and
      # re-runs would leave stale artifacts from changed targets behind. So
      # the draft is created here, and existing asset rows are cleared so
      # every run publishes exactly the current artifact set.
      - name: Create the draft release (re-runs reuse and clear it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          RELEASE_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" | head -1)
          if [ -n "$RELEASE_ID" ]; then
            echo "Draft release for $TAG already exists — reusing it and clearing assets from previous runs."
            for ASSET_ID in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[].id'); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > /dev/null
            done
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --verify-tag --title "Viby $VERSION" --notes-file release-notes.md
          fi

  macos:
    name: macOS (Intel + Apple Silicon)
    needs: prepare-release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (dmg, x64 and arm64)
        run: npm run dist:mac -- --publish never

      # artifactName templates cannot map arm64 -> arm or x64 -> intel, so the
      # two installers are renamed here, before upload. macOS produces no
      # update metadata (dmg.writeUpdateInfo: false), so the release receives
      # exactly these two files.
      - name: Name installers for humans
        run: |
          mv dist/Viby-macos-x64.dmg dist/Viby-macos-intel.dmg
          mv dist/Viby-macos-arm64.dmg dist/Viby-macos-arm.dmg

      - name: Upload the DMGs to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/Viby-macos-arm.dmg dist/Viby-macos-intel.dmg \
            -R "$GITHUB_REPOSITORY" --clobber

  windows:
    name: Windows (x64)
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Uploads into the draft prepared above; electron-builder lists releases
      # first and never calls its own create step when one exists.
      - name: Build and publish (NSIS installer, x64)
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish the finished release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      # Checkout is only needed for the signing script. `-R` keeps gh's target
      # explicit, so the job cannot act on the wrong repository.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "$GITHUB_REF_NAME" --dir artifacts \
            --pattern "Viby-*" -R "$GITHUB_REPOSITORY"

      # Releases are signed when the signing key secret exists. If the public
      # key is committed in src/main/update-key.ts but this secret is missing,
      # installed builds will reject the release — that is the point: a release
      # without a manifest must not be able to bypass verification.
      - name: Sign the update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIBY_UPDATE_KEY: ${{ secrets.VIBY_UPDATE_KEY }}
        run: |
          if [ -z "$VIBY_UPDATE_KEY" ]; then
            echo "::warning::VIBY_UPDATE_KEY is not set — publishing without a signed update manifest."
            exit 0
          fi
          node scripts/update-manifest.mjs sign artifacts
          gh release upload "$GITHUB_REF_NAME" artifacts/update-manifest.json \
            -R "$GITHUB_REPOSITORY" --clobber

      - name: Flip the draft release live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
